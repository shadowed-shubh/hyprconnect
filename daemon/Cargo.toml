[package]
name = "daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
protocol = { path = "../protocol" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
tokio-rustls = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
dirs = "5"
